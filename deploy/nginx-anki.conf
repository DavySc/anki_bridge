# Step 2 of 2: the full block, after the certificate exists. Same file name on the VPS as
# step 1 (/etc/nginx/sites-available/anki-bridge, symlinked into sites-enabled).
server {
    listen 80;
    listen [::]:80;
    server_name anki.panzeilkamp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anki.panzeilkamp.com;

    ssl_certificate /etc/letsencrypt/live/anki.panzeilkamp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anki.panzeilkamp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the real client last: the entry the server reads with TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP streamable HTTP can hold a response open.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
