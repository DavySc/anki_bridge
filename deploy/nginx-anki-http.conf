# Step 1 of 2: port 80 only, so certbot can answer its HTTP challenge for this name.
# Install, `nginx -t`, reload, run `certbot certonly --nginx -d anki.panzeilkamp.com`,
# then replace this file with nginx-anki.conf. The other site's blocks are not touched.
server {
    listen 80;
    listen [::]:80;
    server_name anki.panzeilkamp.com;
    return 404;
}
